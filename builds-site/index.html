<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUILDS — Bahria University Islamabad Literary &amp; Debates Society</title>
    <meta name="description" content="BUILDS — Bahria University Islamabad Literary and Debates Society. Debate wing, literary wing, events, and membership." />
    <meta name="theme-color" content="#16233F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BUILDS" />
    <style>
      :root {
        --bg: #FFFFFF;
        --surface: #FFFFFF;
        --ink: #16233F;
        --ink-body: #232B3D;
        --ink-secondary: #3B4458;
        --ink-muted: #5B6478;
        --ink-faint: #8891A3;
        --border: #E2E6EF;
        --accent: #2C4A82;
        --brand: #16233F;
        --brand-hover: #0F1830;
        --success-bg: #EEF3E8;
        --success-border: #C3D6AE;
        --success-text: #3D5A2A;
      }
      [data-theme="light"] {
        --bg: #FFFFFF;
        --surface: #FFFFFF;
        --ink: #16233F;
        --ink-body: #232B3D;
        --ink-secondary: #3B4458;
        --ink-muted: #5B6478;
        --ink-faint: #8891A3;
        --border: #E2E6EF;
        --accent: #2C4A82;
        --brand: #16233F;
        --brand-hover: #0F1830;
        --success-bg: #EEF3E8;
        --success-border: #C3D6AE;
        --success-text: #3D5A2A;
        background: var(--bg);
      }
      [data-theme="dark"] {
        --bg: #0B1220;
        --surface: #131B2E;
        --ink: #F1F3F9;
        --ink-body: #E6E9F2;
        --ink-secondary: #C7CCDC;
        --ink-muted: #98A1BA;
        --ink-faint: #6C7591;
        --border: #263252;
        --accent: #7FA8F0;
        --brand: #35507F;
        --brand-hover: #4A6BA0;
        --success-bg: #16231A;
        --success-border: #3A5240;
        --success-text: #A9D8A0;
        background: var(--bg);
      }
      html { background: var(--bg); }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("builds:theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "system";
          if (t === "system") {
            var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            t = dark ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="builds-splash">
      <img src="/splash-logo.png" alt="" style="width:160px;height:auto;border-radius:22px;" />
      <div style="font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;letter-spacing:.5px;color:var(--ink);">BUILDS</div>
      <div style="font-family:system-ui,-apple-system,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);">Literary &amp; Debates Society</div>
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <style>
      #builds-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: var(--bg); color: var(--ink);
        transition: opacity .3s ease, visibility .3s ease;
      }
      #builds-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-dots { display: flex; gap: 8px; margin-top: 10px; }
      .splash-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: splash-dot 1.2s ease-in-out infinite; }
      .splash-dots span:nth-child(2) { animation-delay: .15s; }
      .splash-dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes splash-dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
